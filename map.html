<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSTS Installations Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: (dashboard page only) six headline tiles in 2 rows of 3, the map card, installs-over-time chart, numbers table. Map: world view first, then click a country to zoom to a street map with circles for general areas. */
:root{
  --bg:#F6F6F6; --card:#FFFFFF; --ink:#1A1412; --muted:#6B5E59; --line:#E4DDD8; --edge:#47231B;
  --started:#B5381A; --been:#FF9F1C; --going:#FFCC00; --land:#FBF8F4; --land-line:#E8A15A; --sea:#FFFFFF; --bubble:#F4A58A; --tab-on:#FF9F1C;
  --ray:#FFCC00; --ray2:#FF9F1C; --dot:#47231B; --dot-ink:#FFFFFF; --icon-bg:#F4A340; --icon-ink:#47231B;
  --head:'Raleway','Arial',sans-serif; --body:'Source Serif Pro','Source Serif 4',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171110; --card:#211918; --ink:#F6F6F6; --muted:#B9ADA7; --line:#3A2E2B; --edge:#171110;
  --started:#E0603F; --land:#2B211F; --land-line:#8A5A2B; --sea:#1B2326; --bubble:#E8957A; --dot:#C98A6C; --dot-ink:#171110; --icon-ink:#171110; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171110; --card:#211918; --ink:#F6F6F6; --muted:#B9ADA7; --line:#3A2E2B; --edge:#171110;
  --started:#E0603F; --land:#2B211F; --land-line:#8A5A2B; --sea:#1B2326; --bubble:#E8957A; --dot:#C98A6C; --dot-ink:#171110; --icon-ink:#171110; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:28px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,.num{font-family:var(--head);margin:0;text-wrap:balance}
.eyebrow{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.05}
.sub{color:var(--muted);margin:6px 0 0}
h2{font-weight:800;font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.back{font:700 14px var(--head);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--tab-on);border-color:var(--tab-on);color:#1A1412}
.tabs button:focus-visible,.back:focus-visible,.pt:focus-visible,.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--ink);margin:0 0 12px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:13px;height:13px;border-radius:50%;border:1px solid var(--edge);flex:none}
.country{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.country{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;background:var(--sea);border-radius:8px;overflow:hidden}
.mapbox svg.main{display:block;width:100%;height:auto}
.lmap{height:470px;width:100%;background:var(--sea);z-index:0}
@media (max-width:760px){.lmap{height:360px}}
.go{cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.stat .num{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.stat .lab{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.tip{position:fixed;z-index:1000;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:8px 10px;border-radius:6px;max-width:240px;display:none}
.tip b,.leaflet-tooltip b{font-family:var(--head)}
.cnt{display:grid;place-items:center;width:0;height:0}.cnt span{transform:translate(-50%,-50%);font-family:var(--head);font-weight:800;color:#3A1D00;text-shadow:0 0 3px rgba(255,255,255,.6);white-space:nowrap;display:block;position:absolute;line-height:1}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-tooltip{font:13px/1.35 var(--body);color:#1A1412;border-radius:6px}
.method{font-size:13px;color:var(--muted)}
.err{padding:24px;text-align:center;color:var(--muted)}
.u{font-size:.5em;font-weight:700;margin-left:4px;color:var(--muted)}
.back{margin-bottom:12px}
.fade{animation:f .35s ease}
@keyframes f{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
svg text{font-family:var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;gap:14px;align-items:center}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--icon-bg);color:var(--icon-ink);display:grid;place-items:center}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.tile{flex-direction:column;align-items:flex-start;gap:10px}}
.tile .num{font-weight:800;font-size:clamp(24px,3.4vw,32px);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lab{font-size:13px;color:var(--muted);margin-top:4px}
details{margin:0}summary{cursor:pointer;font-family:var(--head);font-weight:700}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--head);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sunchart{display:block;width:100%;height:auto}
</style>
</head><body><div class="wrap" id="app" aria-live="polite"><p class="err">Loading…</p></div>
<div class="tip" id="tip" role="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FULL=false;
try{var _t=new URLSearchParams(location.search).get('theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t)}catch(e){}
const qp=k=>{try{return new URLSearchParams(location.search).get(k)}catch(e){return null}};
const DATA_URL=qp('data')||'data.json', WORLD_URL=qp('world')||'world.json';
const fmt=n=>Math.round(n).toLocaleString('en-US');
const compact=n=>n>=1e6?(n/1e6).toFixed(2)+'M':fmt(n);
const unit=(v,u)=>`${v}<span class="u">${u}</span>`;
const $=id=>document.getElementById(id);
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches)};
const GROUPS=[['started','Where we started'],['been','Where we’ve been'],['going','Where we’re going']];
const COUNTRIES=['Puerto Rico','Honduras','Haiti'];
let D=null,WD=null,view='world',anim=false,LMAP=null;
const clickable=n=>D.countries[n]&&D.countries[n].installations>0;
function legend(){return '<ul class="legend">'+GROUPS.map(([k,t])=>`<li><span class="sw" style="background:var(--${k})"></span><b>${t}</b></li>`).join('')+'</ul>'}
function stat(n,l){return `<div class="stat"><div class="num">${n}</div><div class="lab">${l}</div></div>`}
function statsOf(c){return `<div class="stats">${stat(fmt(c.installations),'installations')}${stat(unit(fmt(c.kw),'kW'),'installed capacity')}${stat(unit(compact(c.lifetime_kwh),'kWh'),'estimated generation to date')}${stat(unit(fmt(c.co2_lifetime_t),'t'),'CO₂ avoided to date')}</div>`}

/* ---------- headline tiles with icons ---------- */
const ICON={
 installs:'<rect x="3" y="10" width="18" height="10" rx="1.2"/><path d="M3 15h18M9 10v10M15 10v10M12 3v2.5M5.5 5.5l1.5 1.7M18.5 5.5L17 7.2"/>',
 capacity:'<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>',
 energy:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
 co2:'<path d="M5 19c-1-8 4-14 14-14 .5 10-5 15-13 14"/><path d="M5 19c3-6 6-9 11-11"/>',
 storage:'<rect x="2.5" y="8" width="16" height="9" rx="2"/><path d="M21 11v3M10.5 10.5l-2 3h3l-2 3"/>',
 homes:'<path d="M3 11.5L12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20"/>'};
const tile=(k,num,lab)=>`<div class="tile"><div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">${ICON[k]}</svg></div><div><div class="num">${num}</div><div class="lab">${lab}</div></div></div>`;
function tiles(){const t=D.totals;return `<section class="tiles" aria-label="Headline numbers">
  ${tile('installs',fmt(t.installations),'solar installations')}
  ${tile('capacity',unit(fmt(t.kw),'kW'),'installed capacity')}
  ${tile('energy',unit(compact(t.lifetime_kwh),'kWh'),'estimated clean energy generated to date')}
  ${tile('co2',unit(fmt(t.co2_lifetime_t),'t'),'estimated CO₂ emissions avoided to date')}
  ${tile('storage',unit(fmt(t.storage_kwh),'kWh'),'battery storage')}
  ${tile('homes',`${fmt(D.type.homes)} + ${fmt(D.type.sites)}`,'homes and critical community sites')}</section>`}

/* ---------- world view (static shapes from world.json) ---------- */
function worldSvg(){
  const W=WD,ins=W.inset,z=W.w/360,ux=(ins.lon+180)*z,uy=(75-ins.lat)*z,ur=ins.r_deg*z;
  const cx=135,cy=W.h-118,R=105,s=R/ur;
  const grp=st=>GROUPS.find(g=>g[0]===st)[1];
  const hit=c=>c.status&&clickable(c.name);
  const tipFor=c=>{const d=D.countries[c.name];return encodeURIComponent(`<b>${c.name}</b><br>${grp(c.status)}`+(d&&d.installations?`<br>${fmt(d.installations)} installations · click to zoom in`:'<br>Installations coming soon'))};
  const shape=c=>c.status
    ?`<path d="${c.path}" style="fill:var(--${c.status});stroke:var(--land-line)" stroke-width="1.1" vector-effect="non-scaling-stroke" class="pt${hit(c)?' go':''}" data-t="${tipFor(c)}" data-go="${hit(c)?c.name:''}" ${hit(c)?'tabindex="0" role="button"':''} aria-label="${c.name}, ${grp(c.status)}"/>`
    :`<path d="${c.path}" style="fill:var(--land);stroke:var(--land-line)" stroke-width="${c.state?.45:.7}" vector-effect="non-scaling-stroke"/>`;
  const near=W.countries.filter(c=>c.bbox[2]>ux-ur&&c.bbox[0]<ux+ur&&c.bbox[3]>uy-ur&&c.bbox[1]<uy+ur);
  const lakes=(W.lakes||[]).map(d=>`<path d="${d}" style="fill:var(--sea);stroke:var(--land-line)" stroke-width=".7" vector-effect="non-scaling-stroke"/>`).join('');
  const base=W.countries.map(c=>c.status?'':shape(c)).join('')+W.countries.map(c=>c.status?shape(c):'').join('')+lakes;
  return `<svg class="main" viewBox="0 0 ${W.w} ${W.h}" id="wsvg" role="group" aria-label="World map. Haiti is where we started; Puerto Rico and Honduras are where we have been; Indiana, Mexico and Uganda are where we are going.">
  <defs><clipPath id="ic"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
  <g>${base}</g>
  <circle cx="${ux}" cy="${uy}" r="${ur}" fill="none" stroke="var(--been)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  <line x1="${ux-ur*.7}" y1="${uy+ur*.7}" x2="${cx+R*.7}" y2="${cy-R*.7}" stroke="var(--been)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--sea)"/>
  <g clip-path="url(#ic)"><g transform="translate(${cx} ${cy}) scale(${s}) translate(${-ux} ${-uy})">${near.map(shape).join('')}</g></g>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--been)" stroke-width="3" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function worldPanel(){
  return `<div>${FULL?'':statsOf(D.totals)}<p class="note" style="margin-top:${FULL?0:14}px">Click a highlighted country, or use the buttons above, to zoom in and see where installations are.</p></div>`;
}

/* ---------- country view: street map + circles for general areas ---------- */
function countryPanel(name){
  const c=D.countries[name];
  return `<div>${statsOf(c)}<p class="note" id="lnote"></p></div>`;
}
function mountMap(name){
  const el=$('lmap'); if(!el) return;
  if(!window.L){el.innerHTML='<p class="err">The street map could not load. Please check back soon.</p>';return}
  const c=D.countries[name],b=c.bounds,m=D.method;
  const map=L.map(el,{scrollWheelZoom:false,zoomSnap:1,attributionControl:true,worldCopyJump:false}); LMAP=map;
  /* OpenStreetMap's own tiles: free, no API key. Fine for a low-traffic site; keep the credit line. */
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:isDark()?'tiles-dark':'',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  const bounds=L.latLngBounds([b[0],b[1]],[b[2],b[3]]);
  map.fitBounds(bounds,{padding:[10,10]});
  const base=map.getZoom();
  map.setMinZoom(base-1); map.setMaxZoom(base+3);       // zoom-in is capped so exact locations are never revealed
  L.geoJSON(c.outline,{style:{color:'#E07A00',weight:2.5,fill:false,opacity:.9},interactive:false}).addTo(map);
  const Lv=c.levels.length?c.levels[c.levels.length-1]:{areas:[],other:c.installations};   // finest grid with at least min_group installations per circle
  const note=$('lnote'),layer=L.layerGroup().addTo(map),RMAXM={'Puerto Rico':3200,'Honduras':5500,'Haiti':9000}[name]||4000;
  /* circles keep a real-world size, so they spread apart as you zoom in; never smaller than 8 px so they stay visible and clickable */
  const mpp=()=>156543.03*Math.cos(bounds.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom());
  function sun(lat,lon,rm,n,tip,dash){
    const rpx=Math.max(8,rm/mpp()),r=rpx*mpp();
    L.circle([lat,lon],{radius:r*1.25,stroke:false,fillColor:'#FFFFFF',fillOpacity:.6,interactive:false}).addTo(layer);
    L.circle([lat,lon],{radius:r,color:'#B35900',weight:2,dashArray:dash||null,fillColor:'#FFC21A',fillOpacity:.92}).bindTooltip(tip,{sticky:true}).addTo(layer);
    if(rpx>=13) L.marker([lat,lon],{interactive:false,icon:L.divIcon({className:'cnt',html:`<span style="font-size:${Math.max(11,Math.min(16,rpx*.7))}px">${n}</span>`,iconSize:[0,0]})}).addTo(layer);
  }
  function draw(){
    layer.clearLayers();
    if(Lv.areas.length){
      const mx=Math.max(1,...Lv.areas.map(a=>a[3]));
      Lv.areas.slice().sort((a,b)=>b[3]-a[3]).forEach(a=>sun(a[0],a[1],RMAXM*(.35+.65*Math.sqrt(a[3]/mx)),a[2],`<b>General area</b><br>${fmt(a[2])} installations<br>${fmt(a[3])} kW installed`));
      note.textContent=`Each circle is a general area, not a site location. Circle size shows installed kW and the number is how many installations. Zoom in to see circles spread out. Areas with fewer than ${m.min_group} installations are not shown separately.`+(Lv.other?` ${fmt(Lv.other)} installations are counted in the totals but not drawn (no map location, or in smaller areas).`:'');
    } else {
      sun(bounds.getCenter().lat,bounds.getCenter().lng,34*mpp(),c.installations,`<b>${name}</b><br>${fmt(c.installations)} installations<br>${fmt(c.kw)} kW installed<br>Shown at country level`,'5 4');
      note.textContent=`Shown at country level, not at a site, to protect the privacy of the communities and sites we serve.`;
    }
  }
  map.on('zoomend',draw); draw();
  /* scroll-wheel zoom only after the map is clicked, so the page still scrolls normally */
  map.on('click focus',()=>map.scrollWheelZoom.enable()); el.addEventListener('mouseleave',()=>map.scrollWheelZoom.disable());
  setTimeout(()=>map.invalidateSize(),50);
}

/* ---------- installs-over-time chart: rays of the sun, evenly spaced and aligned ---------- */
function sunChart(){
  const pts=D.cumulative||[]; if(!pts.length) return '';
  const W=Math.min(1000,Math.max(300,($('app').clientWidth||900)-42)),n=pts.length,small=W<520;
  const padX=12,dx=(W-2*padX)/n,max=Math.max(...pts.map(p=>p.total));
  const rMax=Math.min(54,dx*.36),rMin=Math.max(11,Math.min(15,dx*.2));
  const R=p=>rMin+(rMax-rMin)*Math.sqrt(p.total/max);     // sun size grows with installs
  const H=Math.round(small?W*1.05:W*.58),base=H-34;
  const xs=pts.map((p,i)=>padX+dx*(i+.5));
  const top=rMax*1.6+8,low=base-rMin*1.6-52;
  const ys=pts.map((p,i)=>low-(low-top)*i/(n-1));
  let o=`<svg class="sunchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Installations over time: ${pts.map(p=>fmt(p.total)+' by '+p.label).join(', ')}">`;
  o+=`<defs><radialGradient id="sc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFE680"/><stop offset=".65" stop-color="var(--ray)"/><stop offset="1" stop-color="var(--ray2)"/></radialGradient></defs>`;
  o+=`<line x1="${padX}" y1="${base}" x2="${W-padX}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>`;
  o+=`<polyline points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}" fill="none" stroke="var(--ray2)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const x=xs[i],y=ys[i],r=R(p),fs=Math.max(11,r*.78),lab=Math.max(11,Math.min(14,r*.5+6)),ry=r*1.62;
    o+=`<line x1="${x}" y1="${y+ry+lab+8}" x2="${x}" y2="${base}" stroke="var(--muted)" stroke-width="1" opacity=".55"/>`;
    const k=12,sw=Math.max(2,r*.13);
    for(let j=0;j<k;j++){const a=j/k*2*Math.PI,l0=r*1.22,l1=j%2?r*1.5:r*1.68;
      o+=`<line x1="${(x+Math.cos(a)*l0).toFixed(1)}" y1="${(y+Math.sin(a)*l0).toFixed(1)}" x2="${(x+Math.cos(a)*l1).toFixed(1)}" y2="${(y+Math.sin(a)*l1).toFixed(1)}" stroke="var(--ray)" stroke-width="${sw}" stroke-linecap="round"/>`}
    o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#sc)" stroke="var(--ray2)" stroke-width="${Math.max(1.5,r*.07)}"/>`;
    o+=`<text x="${x}" y="${y+fs*.36}" text-anchor="middle" font-family="var(--head)" font-weight="800" font-size="${fs}" fill="#3A1D00">${fmt(p.total)}</text>`;
    o+=`<text x="${x}" y="${y+ry+lab+1}" text-anchor="middle" font-size="${lab}" font-weight="600" fill="var(--ink)">${p.total===1?'install':'installs'}</text>`;
    o+=`<text x="${x}" y="${base+22}" text-anchor="middle" font-family="var(--head)" font-weight="700" font-size="${Math.max(12,Math.min(16,dx*.2))}" fill="var(--ink)">${p.label}</text>`;
  });
  return o+'</svg>';
}
function table(){
  const row=(n,c)=>`<tr><td>${n}</td><td>${fmt(c.installations)}</td><td>${fmt(c.kw)}</td></tr>`,t=D.totals;
  return `<div class="scroll"><table><thead><tr><th>Country</th><th>Installations</th><th>kW</th></tr></thead><tbody>${COUNTRIES.map(n=>row(n,D.countries[n])).join('')}<tr><td><b>All countries</b></td><td><b>${fmt(t.installations)}</b></td><td><b>${fmt(t.kw)}</b></td></tr></tbody></table></div>`;
}

/* ---------- render ---------- */
function render(){
  if(LMAP){LMAP.remove();LMAP=null}
  const m=D.method,isW=view==='world',name=view;
  $('app').innerHTML=`
  <header><div class="eyebrow">Let’s Share the Sun</div><h1>${FULL?'Our Impact':'Where we have installed solar'}</h1><p class="sub">All installations to date · Updated ${D.updated_label}</p></header>
  ${FULL?tiles():''}
  <section class="card" aria-label="Installations map">
    <div class="card-head"><h2>${isW?fmt(D.totals.installations)+' installations':name}</h2><div class="tabs" role="tablist">${COUNTRIES.map(n=>`<button role="tab" aria-selected="${view===n}" data-c="${n}">${n}</button>`).join('')}</div></div>
    ${isW?legend():'<button class="back" id="back">← Back to world map</button>'}
    <div class="country ${anim?'':'fade'}" style="${isW?'grid-template-columns:minmax(0,1fr)':''}"><div class="mapbox">${isW?worldSvg():'<div class="lmap" id="lmap"></div>'}</div>${isW?worldPanel():countryPanel(name)}</div>
  </section>
  ${FULL?`<section class="card" aria-label="Growth in installations"><div class="card-head"><h2>Installations to date</h2></div><div id="sunwrap">${sunChart()}</div><p class="note">Each sun is the running total of installations on record by the end of that year, and bigger suns mean more installations (2026 is the year so far). Years in between with no installations are left out.</p></section>
  <section class="card"><details><summary>View the numbers as a table</summary>${table()}</details></section>`:''}
  <p class="method">Generation is estimated at ${fmt(m.kwh_per_kw_year)} kWh per kW per year (PVWatts, Adjuntas, Puerto Rico). CO₂ avoided uses ${m.lbs_co2_per_kwh} lbs per kWh (EPA eGRID). Only installations with a confirmed system size are counted. To protect privacy, locations are shown as general areas and no names or addresses are shared.</p>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>zoomTo(b.dataset.c));
  const bk=$('back'); if(bk) bk.onclick=()=>{view='world';render()};
  const tip=$('tip');
  document.querySelectorAll('.pt').forEach(el=>{
    const show=()=>{tip.innerHTML=decodeURIComponent(el.dataset.t);tip.style.display='block';const r=el.getBoundingClientRect();tip.style.left=Math.min(innerWidth-250,Math.max(8,r.left+r.width/2-100))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-10)+'px'};
    el.addEventListener('mouseenter',show);el.addEventListener('focus',show);el.addEventListener('mouseleave',()=>tip.style.display='none');el.addEventListener('blur',()=>tip.style.display='none');
    const g=el.dataset.go; if(g){el.addEventListener('click',()=>zoomTo(g));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomTo(g)}})}
  });
  if(!isW) mountMap(name);
  postH();
}
/* zoom from the world map into a country, then show its street-map view */
function zoomTo(name){
  if(anim||!clickable(name)) return;
  const svg=$('wsvg'); $('tip').style.display='none';
  if(view!=='world'||!svg||matchMedia('(prefers-reduced-motion:reduce)').matches){view=name;render();return}
  const W=WD,c=W.countries.find(x=>x.name===name),b=c.bbox,cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
  const tw=Math.max(b[2]-b[0],b[3]-b[1],4)*3.2,th=tw*W.h/W.w,from=[0,0,W.w,W.h],to=[cx-tw/2,cy-th/2,tw,th];
  anim=true;const t0=performance.now(),T=700;
  (function step(now){
    const p=Math.min(1,(now-t0)/T),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const w=from[2]*Math.pow(to[2]/from[2],e),k=(from[2]-w)/(from[2]-to[2]||1);
    const f=(a,bb)=>a+(bb-a)*k;
    svg.setAttribute('viewBox',`${f(from[0],to[0])} ${f(from[1],to[1])} ${w} ${w*W.h/W.w}`);
    if(p<1) requestAnimationFrame(step); else {anim=false;view=name;render()}
  })(t0);
}
function postH(){try{parent.postMessage({lstsHeight:document.documentElement.scrollHeight},'*')}catch(e){}}
let _rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(!D||anim)return;
  if(view==='world')render(); else {if(LMAP)LMAP.invalidateSize();const sw=$('sunwrap');if(sw)sw.innerHTML=sunChart();postH()}},150)});
Promise.all([window.__LSTS_DATA__?Promise.resolve(window.__LSTS_DATA__):fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}),
             fetch(WORLD_URL).then(r=>{if(!r.ok)throw 0;return r.json()})])
 .then(([d,w])=>{D=d;WD=w;render()}).catch(()=>{$('app').innerHTML='<p class="err">Impact data is temporarily unavailable. Please check back soon.</p>'});
</script>
